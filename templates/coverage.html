<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jurisdiction directory</title><style>@@STYLE@@
body{max-width:1000px;margin:auto}main{padding:1rem}table{border-collapse:collapse;width:100%;margin:.6rem 0}th,td{text-align:left;padding:.45rem;border-bottom:1px solid #aab8a7}th{position:sticky;top:0;background:#e8eedf}td:nth-child(4){white-space:nowrap}.controls{display:flex;flex-wrap:wrap;gap:.5rem}caption{text-align:left;padding:.5rem 0;font-weight:bold}header a{color:white}main>a{display:inline-block;margin-bottom:.6rem}@media(max-width:500px){th,td{font-size:.86rem;padding:.25rem}}</style><header><h1>Jurisdiction directory</h1></header><main><a href="index.html">← Zoning and permits</a><div class="controls"><label>State or area<select id="st">@@OPTS@@</select></label><label>Place or government<input type="search" id="q" placeholder="County, city, township or agency"></label></div>
<p id="stat" aria-live="polite">@@COUNT@@ directory entries. State totals count listings, rules and permit records separately.</p><table><thead id="head"><tr><th>State or territory</th><th>Listed data centers</th><th>Ordinance rules</th><th>Permit history</th><th></th></tr></thead><tbody id="rows">@@ROWS@@</tbody></table><button id="next" hidden>Show more</button><p><a href="../docs/national-coverage.md">Coverage and sources</a> · <a href="../docs/national-progress.md">Leading counties and cities</a></p></main>@@DATA@@<script>@@LIB@@</script><script>
const states=@@STATES@@,sel=document.getElementById('st'),q=document.getElementById('q'),root=document.getElementById('rows'),heading=document.getElementById('head'),stat=document.getElementById('stat'),more=document.getElementById('next'),cache=new Map(),front=[root.innerHTML,heading.innerHTML,stat.textContent];let found=[],shown=0;
function get(s){if(!cache.has(s)){let b=atob(document.getElementById('pack-'+s).textContent);cache.set(s,JSON.parse(new TextDecoder().decode(pako.ungzip(Uint8Array.from(b,x=>x.charCodeAt(0))))))}return cache.get(s)}
function page(){for(const [s,r] of found.slice(shown,shown+40)){let tr=root.insertRow();for(let t of [r[0],r[1],r[3]])tr.insertCell().textContent=t;let td=tr.insertCell(),a=document.createElement('a');if(/^https?:\/\//.test(r[4])){a.href=r[4];a.textContent='Source';td.append(a)}for(const [name,u] of r[5]||[]){if(!/^https?:/.test(u))continue;let b=document.createElement('a');b.href=u;b.textContent=name==='Municipal meeting records'?'Meetings':'Code';b.title=name+' · from a government page';td.append(' · ',b)}}shown+=40;more.hidden=shown>=found.length}
function search(){const t=q.value.trim().toLowerCase(),s=sel.value;if(!s&&!t){[root.innerHTML,heading.innerHTML,stat.textContent]=front;more.hidden=true;return}root.replaceChildren();heading.innerHTML='<tr><th>Name</th><th>Type</th><th>Coverage</th><th></th></tr>';found=[];for(const k of s?[s]:states){for(const r of get(k))if(!t||r[0].toLowerCase().includes(t)||r[2]===t)found.push([k,r])}stat.textContent=found.length.toLocaleString()+' matching entries';shown=0;page()}
let timer;q.oninput=()=>{clearTimeout(timer);timer=setTimeout(search,110)};sel.onchange=search;more.onclick=page;
</script></html>
