name: Validate and deploy atlas
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      - run: make site
      - run: python3 scripts/pipeline/audit_descriptions.py
      - name: Replay telecom collector twice and check sibling isolation
        run: python3 scripts/pipeline/jurisdiction.py telecom
      - name: Browser journeys, offline loading and PDF printing
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tests/viewer.mjs
      - name: Check browser report against this exact build
        run: python3 scripts/pipeline/release_summary.py
      - name: Keep validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-validation
          path: |
            output/uat.json
            output/map-sample.pdf
            output/description_audit.json
      - name: Upload validated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
